[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq-explorer"
version = "0.1.0"
description = "Comprehensive interactive RNA-seq downstream analysis workstation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Brian Amburn"}
]
keywords = ["rnaseq", "deseq2", "rmats", "gsea", "visualization", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "pandas>=2.0",
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.0",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "gseapy>=1.1",
    "gprofiler-official>=1.0",
    "networkx>=3.0",
    "openpyxl>=3.0",
    "mygene>=3.2",
]

[project.optional-dependencies]
full = [
    "matplotlib-venn>=0.11",
    "upsetplot>=0.6",
    "adjustText>=0.9",
    "python-pptx>=0.6",
    "Pillow>=9.0",
]
dev = [
    "pytest>=7.0",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/SpaceSorcerer/rnaseq-explorer"
Repository = "https://github.com/SpaceSorcerer/rnaseq-explorer"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    "deseq2_rmats_filter_pipeline.py",
    "pipeline_launcher.py",
    "new_functions.py",
    "run_4condition.py",
    "run_hscharme_cutoffs.py",
    "run_p01_cutoffs.py",
    "batch_loader.py",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
